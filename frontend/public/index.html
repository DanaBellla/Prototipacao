<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090B" />
    <meta name="description" content="BandaConnection — a plataforma que conecta músicos, estabelecimentos e ouvintes." />
    <title>BandaConnection · Onde a música ao vivo acontece</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- App container. Views are rendered here by JS. -->
    <div id="app" data-testid="app-root"></div>

    <!-- Toast host -->
    <div id="toast-host" class="toast-host" data-testid="toast-host"></div>

    <!-- Modal host -->
    <div id="modal-host" class="modal-host" data-testid="modal-host"></div>

    <!-- Legacy React root (unused, kept to prevent bundle errors) -->
    <div id="root" style="display:none"></div>

    <!-- Data / State / Auth -->
    <script src="/js/data.js"></script>
    <script src="/js/store.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>

    <!-- Views -->
    <script src="/js/views/landing.js"></script>
    <script src="/js/views/auth-view.js"></script>
    <script src="/js/views/app-shell.js"></script>
    <script src="/js/views/feed.js"></script>
    <script src="/js/views/explore.js"></script>
    <script src="/js/views/profile.js"></script>

    <!-- Router / Boot -->
    <script src="/js/router.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
